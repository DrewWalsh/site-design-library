<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Design specimen</title>
    <style>
      body {
        margin: 0;
      }
      * {
        box-sizing: border-box;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        touch-action: manipulation;
      }
      button:not(:disabled),
      summary {
        cursor: pointer;
      }
      img,
      svg {
        max-width: 100%;
      }
      button:disabled {
        cursor: not-allowed;
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 4px;
      }
      button,
      input,
      select {
        min-height: 40px;
      }
      textarea {
        max-width: 100%;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="specimen"></div>
    <script type="module" src="/src/preview/main.ts"></script>
  </body>
</html>
