[build]
  command = "pnpm build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
[[redirects]]
  from = "/preview/*"
  to = "/preview.html"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
[[headers]]
  for = "/references/*"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
